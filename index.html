<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z Money Tracker</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo-round.png" id="favicon-16" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-round.png" id="favicon-32" />
    <link rel="icon" type="image/png" sizes="48x48" href="/logo-round.png" id="favicon-48" />

    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
